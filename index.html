<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'unsafe-inline'; img-src 'self' data:">
<title>QiuBar · 蓝牙电量</title>
<script src="./node_modules/gsap/dist/gsap.min.js"
        onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js';document.head.appendChild(s)"></script>
<style>
:root{
  --panel:rgba(13,18,23,.97); --panel2:rgba(160,220,255,.045);
  --ink:#E4EFEA; --dim:#7E939C; --line:rgba(151,203,255,.11);
  --ok:#3DFFA2; --warn:#FFC53D; --crit:#FF4D5E; --cyan:#5FE8FF;
  --acc:var(--ok);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:transparent;overflow:hidden}
body{
  font-family:Bahnschrift,'Segoe UI','Microsoft YaHei UI',sans-serif;
  color:var(--ink);user-select:none;cursor:default;
  font-variant-numeric:tabular-nums;
}
.mono{font-family:'Cascadia Code',Consolas,monospace}

#app{
  position:fixed;inset:8px;display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--line);border-radius:18px;
  /* 阴影必须收在 8px 的透明边距内，否则会被窗口边缘切断，出现一条生硬的暗边 */
  box-shadow:0 2px 8px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);
  padding:16px 18px 12px;overflow:hidden;
}
#app::after{ /* 噪点 */
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:.05;
  background:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/></filter><rect width="140" height="140" filter="url(%23n)" opacity="0.6"/></svg>');
}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:8px;padding-bottom:12px}
.mark{display:flex;align-items:baseline;gap:7px}
.mark b{font-size:13px;font-weight:600;letter-spacing:.34em}
.mark i{width:5px;height:5px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);align-self:center}
.mark small{font-size:9px;letter-spacing:.22em;color:var(--dim)}
header .sp{flex:1}
.icobtn{
  width:28px;height:28px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);
  color:var(--dim);display:grid;place-items:center;cursor:pointer;transition:.18s;
}
.icobtn:hover{color:var(--cyan);border-color:rgba(95,232,255,.35)}

/* ---------- stage / states ---------- */
#stage{flex:1;position:relative;min-height:0}
.state{
  position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;text-align:center;color:var(--dim);
}
#app[data-mode=loading] #st-loading{display:flex}
#app[data-mode=empty]  #st-empty{display:flex}
#app[data-mode=error]  #st-error{display:flex}
#app[data-mode=ready]  #carousel{display:block}
.state .big{color:var(--cyan);opacity:.85}
#st-error .big{color:var(--crit)}
.state h2{font-size:15px;font-weight:600;color:var(--ink);letter-spacing:.06em}
.state p{font-size:11.5px;line-height:1.7;max-width:250px}
.state .retry{
  border:1px solid var(--line);background:var(--panel2);color:var(--cyan);border-radius:10px;
  padding:7px 18px;font:inherit;font-size:12px;letter-spacing:.1em;cursor:pointer;transition:.18s;
}
.state .retry:hover{border-color:rgba(95,232,255,.4)}
.ring{
  width:44px;height:44px;border-radius:50%;
  border:2px solid var(--line);border-top-color:var(--cyan);
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
.state .big svg{animation:breathe 3s ease-in-out infinite}

/* ---------- carousel ---------- */
#carousel{display:none;height:100%;overflow:hidden;touch-action:pan-y}
#track{display:flex;height:100%;will-change:transform}
.slide{
  flex:0 0 100%;display:flex;flex-direction:column;justify-content:space-between;
  padding:6px 4px 2px;
}
.slide.st-warn{--acc:var(--warn)} .slide.st-crit{--acc:var(--crit)} .slide.st-none{--acc:#5E7480}

.dev-head{display:flex;align-items:center;gap:11px;padding:2px 4px 10px}
.glyph-tile{
  width:40px;height:40px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--acc);transition:color .3s;
}
.dev-meta{min-width:0;flex:1}
.dev-name{font-size:15.5px;font-weight:600;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dev-sub{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--dim);letter-spacing:.14em;margin-top:3px}
.dev-sub .dot{width:5px;height:5px;border-radius:50%;background:var(--ok);box-shadow:0 0 7px var(--ok);transition:.3s}
.slide.off .dev-sub .dot{background:#5E7480;box-shadow:none}
.slide.off .dev-name{color:var(--dim)}

/* ---------- gauge ---------- */
.gauge-wrap{position:relative;display:grid;place-items:center;padding:2px 0}
.aura{
  position:absolute;width:230px;height:230px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,var(--acc) 0%,transparent 62%);opacity:.09;transition:background .4s;
}
.slide.st-crit .aura{animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.10;transform:scale(1)}50%{opacity:.42;transform:scale(1.05)}}
.gauge{width:224px;height:224px;display:block}
.gauge .arc-bg{fill:none;stroke:rgba(151,203,255,.09);stroke-width:9;stroke-linecap:round}
.gauge .arc{fill:none;stroke:var(--acc);stroke-width:9;stroke-linecap:round;
  filter:drop-shadow(0 0 7px var(--acc));transition:stroke .4s}
.gauge .ticks line{stroke:rgba(151,203,255,.16);stroke-width:1.4}
.gauge .ticks line.mj{stroke:rgba(151,203,255,.38);stroke-width:2.2}
.readout{position:absolute;text-align:center;pointer-events:none}
.readout .num{font-size:56px;font-weight:700;letter-spacing:-.02em;line-height:1;color:var(--ink);
  display:flex;align-items:flex-start;justify-content:center;gap:2px;transition:color .4s}
.slide.st-crit .readout .num{color:var(--crit)}
.readout .unit{font-size:17px;color:var(--dim);margin-top:7px;font-weight:600}
.state-label{margin-top:9px;font-size:10.5px;letter-spacing:.3em;color:var(--acc);transition:color .4s}

/* ---------- cells ---------- */
.cells{display:flex;gap:3px;padding:0 4px 10px}
.cells i{
  flex:1;height:5px;border-radius:2.5px;background:rgba(151,203,255,.10);
  transform-origin:left;transition:background .3s;
}
.cells i.on{background:var(--acc);box-shadow:0 0 6px color-mix(in srgb,var(--acc) 60%,transparent)}

/* ---------- rail / footer ---------- */
#rail{display:flex;gap:7px;padding:10px 2px 0;overflow-x:auto;scrollbar-width:none}
#rail::-webkit-scrollbar{display:none}
.badge{
  flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:6px 10px 6px 8px;
  border:1px solid var(--line);border-radius:11px;background:transparent;color:var(--dim);
  font:inherit;font-size:11.5px;cursor:pointer;transition:.2s;
}
.badge svg{width:15px;height:15px}
.badge:hover{border-color:rgba(151,203,255,.3)}
.badge.on{border-color:var(--acc);color:var(--ink);background:var(--panel2)}
.badge .bl{color:var(--acc);font-weight:600;letter-spacing:.04em}
.badge.off .bl{color:#5E7480}

footer{display:flex;align-items:center;justify-content:space-between;padding-top:10px;
  font-size:9.5px;letter-spacing:.18em;color:var(--dim)}
footer .live{display:flex;align-items:center;gap:6px}
footer .live i{width:4px;height:4px;border-radius:50%;background:var(--cyan);animation:breathe 2.2s infinite}
</style>
</head>
<body>
<div id="app" data-mode="loading">
  <header>
    <div class="mark"><b>QIUBAR</b><i></i><small>BLUETOOTH&nbsp;POWER</small></div>
    <span class="sp"></span>
    <button class="icobtn" id="refresh" title="立即刷新">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 3v4h-4"/>
      </svg>
    </button>
  </header>

  <main id="stage">
    <div class="state" id="st-loading"><div class="ring"></div><p class="mono" style="letter-spacing:.24em">SCANNING…</p></div>
    <div class="state" id="st-empty">
      <div class="big"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6.5 7.5 17 15.5 11.5 20.5 11.5 3.5 17 8.5 6.5 16.5"/></svg></div>
      <h2>未发现已配对蓝牙设备</h2>
      <p>配对耳机 / 鼠标 / 键盘后<br>点击右上角刷新，或等待自动扫描</p>
    </div>
    <div class="state" id="st-error">
      <div class="big"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 3 2.5 20h19z"/><line x1="12" y1="9.5" x2="12" y2="14.5"/><circle cx="12" cy="17.4" r=".4"/></svg></div>
      <h2>无法读取蓝牙状态</h2>
      <p id="err-msg">请确认蓝牙已开启</p>
      <button class="retry" id="retry">重新扫描</button>
    </div>
    <div id="carousel"><div id="track"></div></div>
  </main>

  <nav id="rail"></nav>
  <footer>
    <span class="live"><i></i>AUTO&nbsp;·&nbsp;30S</span>
    <span class="mono" id="updated">等待数据…</span>
  </footer>
</div>

<script>
const { ipcRenderer } = require('electron')
const $ = s => document.querySelector(s)
gsap.config({ nullTargetWarn: false })

/* ---------- gauge geometry ---------- */
const R = 88, C = 110, START = 150, SWEEP = 240
const rad = d => d * Math.PI / 180
const P = (a, r) => `${(C + r * Math.cos(a)).toFixed(1)} ${(C + r * Math.sin(a)).toFixed(1)}`
const ARC_D = `M ${P(rad(START), R)} A ${R} ${R} 0 1 1 ${P(rad(START + SWEEP), R)}`
const LEN = (2 * Math.PI * R * SWEEP / 360)
const ticks = Array.from({ length: 25 }, (_, i) => {
  const a = rad(START + i * 10), mj = i % 6 === 0
  const [x1, y1] = P(a, mj ? 69 : 74).split(' '), [x2, y2] = P(a, 80).split(' ')
  return `<line class="${mj ? 'mj' : ''}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`
}).join('')

/* ---------- device kinds ---------- */
const GLYPHS = {
  mouse: '<rect x="7.5" y="2.5" width="9" height="19" rx="4.5"/><line x1="12" y1="6.5" x2="12" y2="10.5"/>',
  keyboard: '<rect x="2.5" y="6.5" width="19" height="11" rx="2"/>' + [6, 9, 12, 15, 18].map(x => `<circle cx="${x}" cy="10" r=".9"/>`).join('') + '<line x1="7" y1="14.5" x2="17" y2="14.5"/>',
  headphones: '<path d="M4 13.5a8 8 0 0 1 16 0"/><rect x="2.5" y="12" width="4" height="8" rx="2"/><rect x="17.5" y="12" width="4" height="8" rx="2"/>',
  buds: '<circle cx="8" cy="8" r="3.4"/><line x1="7.2" y1="10.5" x2="6.2" y2="16.5"/><circle cx="16" cy="8" r="3.4"/><line x1="16.8" y1="10.5" x2="17.8" y2="16.5"/>',
  watch: '<circle cx="12" cy="12" r="5.2"/><rect x="9" y="2.8" width="6" height="4" rx="1.2"/><rect x="9" y="17.2" width="6" height="4" rx="1.2"/>',
  pad: '<path d="M7 8h10a5 5 0 0 1 5 5v1.2a3.8 3.8 0 0 1-6.8 2.3l-.9-1.3H9.7l-.9 1.3A3.8 3.8 0 0 1 2 14.2V13a5 5 0 0 1 5-5z"/><line x1="8" y1="11" x2="8" y2="14.5"/><line x1="6.3" y1="12.75" x2="9.7" y2="12.75"/><circle cx="15.7" cy="11.2" r=".9"/><circle cx="17.6" cy="13.4" r=".9"/>',
  bt: '<polyline points="6.5 7.5 17 15.5 11.5 20.5 11.5 3.5 17 8.5 6.5 16.5"/>'
}
const glyph = (k, s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${GLYPHS[k] || GLYPHS.bt}</svg>`
const KINDS = [
  [/mouse|mx \d|g502|g304|g pro|vortex|lift|pebble|roam/i, 'mouse'],
  [/keyboard|keychron|hhkb|anne|k8 |k3 |k2 |nuphy|lgpi?l?us| Alloy/i, 'keyboard'],
  [/buds|airpods|earbuds|freebuds|耳机|豆/i, 'buds'],
  [/headphone|headset|wh-\d|xm\d|px7|arctis|momentum|耳麦|头戴/i, 'headphones'],
  [/watch|band|手环|手表/i, 'watch'],
  [/controller|gamepad|xbox|dualsense|8bitdo|手柄/i, 'pad'],
]
const kindOf = n => (KINDS.find(([re]) => re.test(n)) || [, 'bt'])[1]

const stOf = d => d.battery < 0 ? 'none' : d.battery <= 10 ? 'crit' : d.battery <= 20 ? 'warn' : 'ok'
const labelOf = d => d.battery < 0 ? (d.connected ? '读取中' : '未连接')
  : d.battery <= 10 ? '电量严重不足' : d.battery <= 20 ? '电量偏低' : '电量充足'
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

/* ---------- build ---------- */
const app = $('#app'), track = $('#track'), rail = $('#rail')
let devices = [], idx = 0, lastSig = '', rot = null

function slideHTML(d) {
  return `<div class="slide st-${stOf(d)} ${d.connected ? '' : 'off'}">
    <div class="dev-head">
      <div class="glyph-tile">${glyph(kindOf(d.name), 20)}</div>
      <div class="dev-meta">
        <div class="dev-name">${esc(d.name)}</div>
        <div class="dev-sub"><i class="dot"></i>${d.connected ? '已连接' : '未连接'}</div>
      </div>
    </div>
    <div class="gauge-wrap">
      <div class="aura"></div>
      <svg class="gauge" viewBox="0 0 220 220">
        <g class="ticks">${ticks}</g>
        <path class="arc-bg" d="${ARC_D}"/>
        <path class="arc" d="${ARC_D}" stroke-dasharray="${LEN}" stroke-dashoffset="${LEN}"/>
      </svg>
      <div class="readout">
        <div class="num"><span class="n">--</span><span class="unit">%</span></div>
        <div class="state-label">${labelOf(d)}</div>
      </div>
    </div>
    <div class="cells">${'<i></i>'.repeat(10)}</div>
  </div>`
}

function build() {
  track.innerHTML = devices.map(slideHTML).join('')
  rail.innerHTML = devices.map((d, i) =>
    `<button class="badge ${d.connected ? '' : 'off'}" data-i="${i}" title="${esc(d.name)}">
      ${glyph(kindOf(d.name), 15)}<span class="bl">${d.battery >= 0 ? d.battery + '%' : '--'}</span>
    </button>`).join('')
  rail.querySelectorAll('.badge').forEach(b => b.onclick = () => go(+b.dataset.i))
  idx = Math.min(idx, Math.max(devices.length - 1, 0))
  go(idx, true)
}

/* ---------- per-slide animation (GSAP) ---------- */
function tweenNum(slide, to) {
  const el = slide.querySelector('.n')
  if (to < 0) { el.textContent = '--'; return }
  const o = { v: parseInt(el.textContent) || 0 }
  gsap.to(o, { v: to, duration: .9, ease: 'power2.out', onUpdate: () => el.textContent = Math.round(o.v) })
}
function animateSlide(i) {
  const s = track.children[i]; if (!s) return
  const d = devices[i]
  tweenNum(s, d.battery)
  gsap.fromTo(s.querySelector('.arc'),
    { strokeDashoffset: LEN },
    { strokeDashoffset: LEN * (1 - Math.max(d.battery, 0) / 100), duration: 1, ease: 'power3.out' })
  const cellsOn = s.querySelectorAll('.cells i.on')
  if (cellsOn.length) gsap.fromTo(cellsOn,
    { scaleX: 0 }, { scaleX: 1, duration: .3, stagger: .04, ease: 'power2.out', delay: .25 })
  gsap.fromTo(s.querySelector('.dev-head'), { y: 8, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: .45, ease: 'power3.out' })
}

function go(n, instant) {
  const count = devices.length; if (!count) return
  idx = ((n % count) + count) % count
  gsap.to(track, { xPercent: -idx * 100, duration: instant ? 0 : .55, ease: 'power3.inOut' })
  rail.querySelectorAll('.badge').forEach((b, i) => b.classList.toggle('on', i === idx))
  animateSlide(idx)
  restart()
}

/* ---------- rotation ---------- */
const TICK = 4500
let timer = null
function restart() { clearInterval(timer); timer = setInterval(() => { if (!document.hidden) go(idx + 1) }, TICK) }
$('#stage').addEventListener('mouseenter', () => clearInterval(timer))
$('#stage').addEventListener('mouseleave', restart)

/* swipe */
let sx = null
$('#carousel').addEventListener('pointerdown', e => sx = e.clientX)
$('#carousel').addEventListener('pointerup', e => {
  if (sx === null) return
  const dx = e.clientX - sx; sx = null
  if (Math.abs(dx) > 42) go(idx + (dx < 0 ? 1 : -1))
})

/* ---------- live updates ---------- */
function paintCells(slide, lvl) {
  const on = lvl < 0 ? 0 : Math.round(lvl / 10)
  slide.querySelectorAll('.cells i').forEach((c, i) => c.classList.toggle('on', i < on))
}
function updateValues() {
  devices.forEach((d, i) => {
    const s = track.children[i]; if (!s) return
    s.className = `slide st-${stOf(d)} ${d.connected ? '' : 'off'}`
    s.querySelector('.state-label').textContent = labelOf(d)
    tweenNum(s, d.battery)
    gsap.to(s.querySelector('.arc'), { strokeDashoffset: LEN * (1 - Math.max(d.battery, 0) / 100), duration: .8, ease: 'power2.out' })
    paintCells(s, d.battery)
    const b = rail.children[i]
    if (b) { b.classList.toggle('off', !d.connected); b.querySelector('.bl').textContent = d.battery >= 0 ? d.battery + '%' : '--' }
  })
}

ipcRenderer.on('devices', (_e, { devices: ds, err, ts }) => {
  devices = ds || []
  $('#updated').textContent = '更新 ' + new Date(ts).toLocaleTimeString('zh-CN', { hour12: false })
  if (!devices.length && err) {
    $('#err-msg').textContent = err.slice(0, 120)
    app.dataset.mode = 'error'; clearInterval(timer); return
  }
  if (!devices.length) { app.dataset.mode = 'empty'; clearInterval(timer); return }
  app.dataset.mode = 'ready'
  const sig = devices.map(d => d.name).join('§')
  if (sig !== lastSig) { lastSig = sig; build() } else updateValues()
})

ipcRenderer.on('shown', () => {
  gsap.fromTo(app, { y: 8, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: .3, ease: 'power3.out' })
  if (app.dataset.mode === 'ready') animateSlide(idx)
})

/* ---------- controls ---------- */
$('#refresh').onclick = () => {
  gsap.fromTo('#refresh svg', { rotation: 0 }, { rotation: 360, duration: .7, ease: 'power2.inOut' })
  ipcRenderer.send('refresh')
}
$('#retry').onclick = () => ipcRenderer.send('refresh')
addEventListener('keydown', e => { if (e.key === 'Escape') ipcRenderer.send('hide') })
addEventListener('wheel', e => { if (Math.abs(e.deltaY) > 24 && app.dataset.mode === 'ready') go(idx + (e.deltaY > 0 ? 1 : -1)) })

if (matchMedia('(prefers-reduced-motion: reduce)').matches) gsap.globalTimeline.timeScale(50)

/* ---------- tray icon (drawn here, used by main) ---------- */
window.trayIcon = (level, st) => {
  const c = document.createElement('canvas'); c.width = c.height = 32
  const x = c.getContext('2d')
  const col = { ok: '#3DFFA2', warn: '#FFC53D', crit: '#FF4D5E', none: '#93A8B0' }[st] || '#93A8B0'
  x.strokeStyle = col; x.lineWidth = 2.5
  x.beginPath(); x.roundRect(2.5, 2.5, 27, 27, 7); x.stroke()
  x.fillStyle = col; x.textAlign = 'center'; x.textBaseline = 'middle'
  if (level >= 0) { x.font = '700 16px Bahnschrift,Segoe UI'; x.fillText(level, 16, 17.5) }
  else {
    x.lineWidth = 2.2; x.lineCap = 'round'; x.lineJoin = 'round'
    x.beginPath()
    x.moveTo(12.5, 9); x.lineTo(19.5, 14.2); x.lineTo(15.5, 17.6); x.lineTo(15.5, 6.4); x.lineTo(19.5, 9.8); x.lineTo(12.5, 15)
    x.moveTo(15.5, 6.4); x.lineTo(15.5, 21.5); x.moveTo(12.5, 18.2); x.lineTo(15.5, 21.5)
    x.stroke()
  }
  return c.toDataURL()
}
</script>
</body>
</html>
